name: Build Logic Gate Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true
      - name: Restore project archive from its pre-deletion commit
        run: |
          curl -fL "https://raw.githubusercontent.com/Jokerooo539/Logic-gate-app/5947f7b311022ad2a27335ce9b23320e5a62a3d4/LogicLabAndroid-GitHub-Ready-1.zip" -o project.zip
          mkdir project
          unzip -q project.zip -d project
      - name: Locate Gradle project
        run: |
          SETTINGS_FILE=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS_FILE" || { echo "Gradle settings file not found"; exit 1; }
          echo "PROJECT_ROOT=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
      - name: Build Debug APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Logic-Gate-App-Debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
